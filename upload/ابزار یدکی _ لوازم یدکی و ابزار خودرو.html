<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ابزار یدکی | لوازم یدکی و ابزار خودرو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#0f1b2d;--mute:#5b6778;--navy:#0b1f3a;--navy2:#143a66;--or:#ff6a1a;--or2:#e85500;--ok:#17a05d;--line:#e3e8ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1220;--card:#121d30;--ink:#eef3fa;--mute:#9aa8bb;--line:#22314a}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.w{max-width:1160px;margin:auto;padding:0 16px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1160px;margin:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.logo small{display:block;font-size:10px;font-weight:400;color:#9db4d3;letter-spacing:.5px;direction:ltr}
.search{flex:1;display:flex}.search input{flex:1;min-width:0;border:0;padding:9px 14px;border-radius:0 10px 10px 0;font:inherit}
.search button{border:0;background:var(--or);color:#fff;padding:0 16px;border-radius:10px 0 0 10px}
.cartb{position:relative;background:#ffffff1a;border:0;color:#fff;padding:8px 14px;border-radius:10px}
.cartb b{position:absolute;top:-6px;left:-6px;background:var(--or);border-radius:99px;min-width:20px;font-size:12px;text-align:center}
nav{background:var(--navy2);overflow-x:auto;white-space:nowrap}nav .w{display:flex;gap:22px;padding:6px 16px;font-size:14px;color:#dbe7f7}
.hero{background:radial-gradient(900px 400px at 80% 0,#1e5aa0 0,transparent 60%),var(--navy);color:#fff;padding:40px 0 56px}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(26px,4.4vw,44px);margin:0 0 10px;line-height:1.4}.hero h1 em{color:var(--or);font-style:normal}
.hero p{color:#c3d3e9;margin:0 0 18px}
.fit{background:#fff;color:var(--ink);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px}
.fit select{padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:#0f1b2d;min-width:0}
.btn{background:var(--or);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600;transition:.2s}.btn:hover{background:var(--or2);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.scene{perspective:900px;height:300px;display:grid;place-items:center}
.rot{position:relative;width:240px;height:240px;transform-style:preserve-3d;transition:transform .15s;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{translate:0 -10px}}
.rot svg{position:absolute;inset:0;width:100%;height:100%}
.g1{transform:translateZ(-40px);animation:sp 14s linear infinite}.g2{transform:translateZ(0);animation:sp 9s linear infinite reverse}.g3{transform:translateZ(40px)}
@keyframes sp{to{rotate:360deg}}
@media(prefers-reduced-motion:reduce){.rot,.g1,.g2{animation:none}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-28px}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:13px;box-shadow:0 6px 18px #0b1f3a14}.trust b{display:block;font-size:15px}
h2{font-size:22px;margin:36px 0 14px;display:flex;justify-content:space-between;align-items:center}h2 a{font-size:14px;color:var(--or)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;font-size:14px;transition:.2s}.cat:hover{border-color:var(--or);transform:translateY(-3px)}.cat span{font-size:28px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}.pc:hover{box-shadow:0 10px 26px #0b1f3a22;transform:translateY(-3px)}
.pi{height:150px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#e8eef7,#f7f9fc);position:relative}
.pi i{position:absolute;top:10px;right:10px;background:var(--or);color:#fff;font-size:12px;font-style:normal;padding:0 8px;border-radius:99px}
.pb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.pb h3{font-size:14px;margin:0;line-height:1.6}.pb small{color:var(--mute)}
.pr{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}.pr s{color:var(--mute);font-size:12px;display:block}.pr b{font-size:16px}
.pr .btn{padding:8px 12px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar select,.bar button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}.bar .on{background:var(--navy);color:#fff}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}.pd .pi{height:340px;font-size:120px;border-radius:18px}
.pd .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.pd ul{padding:0 18px;margin:6px 0;color:var(--mute)}.qty{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.qty button{border:0;background:var(--card);color:var(--ink);padding:6px 14px}.qty span{padding:6px 12px}
.ok{color:var(--ok);font-weight:600}.tabs{display:flex;gap:6px;margin-top:20px}
.dr{position:fixed;inset:0 auto 0 0;width:min(380px,100%);background:var(--card);z-index:40;padding:16px;transform:translateX(-105%);transition:.3s;overflow:auto;box-shadow:10px 0 40px #0006;padding-top:calc(16px + env(safe-area-inset-top,0px))}.dr.open{transform:none}
.ci{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
footer{background:var(--navy);color:#b9c9e0;margin-top:48px;padding:28px 0 20px;font-size:14px}footer .w{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}footer b{color:#fff}
.sticky{display:none}
@media(max-width:760px){.hero .w,.pd{grid-template-columns:1fr}.fit{grid-template-columns:1fr 1fr}.trust{grid-template-columns:1fr 1fr}.scene{height:230px}.hd{flex-wrap:wrap}.search{order:3;flex-basis:100%}
.sticky{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:10px;z-index:15;align-items:center;justify-content:space-between}}
.ann{background:var(--or);color:#fff;text-align:center;font-size:13px;padding:4px 10px}
.hero{position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(#000,transparent)}.hero .w{position:relative}
.btn{box-shadow:0 6px 16px #ff6a1a44}.btn.ghost{box-shadow:none}
.crumb{font-size:13px;color:var(--mute);margin:16px 0 0}.crumb a:hover{color:var(--or)}
.fm{display:grid;gap:12px}.fm label{font-size:13px;color:var(--mute);display:grid;gap:4px}.fm input,.fm select,.fm textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink);width:100%}.fm input:focus,.fm select:focus,.fm textarea:focus{outline:2px solid var(--or);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lay{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.ban{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}.ban a{border-radius:18px;padding:22px;color:#fff;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:4px;transition:.2s}.ban a:hover{transform:translateY(-3px)}.ban b{font-size:20px}
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bund{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bund .pi{height:80px;width:80px;font-size:36px;border-radius:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--mute);margin:8px 0 2px}
.cd{display:flex;gap:8px;direction:ltr;align-items:center}.cd span{background:var(--navy);color:#fff;border-radius:10px;padding:6px 12px;font-weight:800;min-width:54px;text-align:center}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;box-shadow:0 8px 24px #0006}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--ok);transition:.3s}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.opt input{width:auto!important}
.sum{display:flex;justify-content:space-between;padding:4px 0}
@media(max-width:760px){.lay,.ban,.two{grid-template-columns:1fr}}
.logo{font-size:24px}.lg{display:flex;align-items:center}.lg b{color:#fff;font-weight:800}.lg i{font-style:normal;background:var(--or);color:#fff;border-radius:8px;padding:0 12px;margin-inline-start:6px;font-weight:800}
.qt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.qt a{background:#ffffff14;border:1px solid #ffffff26;border-radius:16px;padding:20px 8px;text-align:center;color:#fff;font-size:15px;transition:.2s}.qt a:hover{background:#ffffff26;transform:translateY(-3px)}.qt span{display:block;font-size:32px}
nav{overflow:visible;white-space:normal}nav .w{flex-wrap:wrap;gap:4px 20px;padding:8px 16px}nav a{padding:2px 0}nav a:hover{color:#fff}
@media(max-width:760px){body{padding-bottom:76px}header{position:static}nav .w{gap:4px 16px}}
.trust{position:relative;z-index:3}.logo{gap:10px}
.lg i{background:#ffb703;color:#0b1f3a}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}.grid>.pc{flex:0 0 calc((100% - 64px)/5);min-width:0}.pr{flex-wrap:wrap}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.cats>.cat{flex:0 0 calc((100% - 60px)/6)}
h2{position:relative;padding-inline-start:16px}h2:before{content:"";position:absolute;inset-inline-start:0;top:7px;bottom:7px;width:5px;border-radius:4px;background:#ffb703}
.pb h3{min-height:3.2em}.pi{height:160px}
@media(max-width:1020px){.grid>.pc{flex-basis:calc((100% - 48px)/4)}}
@media(max-width:820px){.grid>.pc{flex-basis:calc((100% - 32px)/3)}.cats>.cat{flex-basis:calc((100% - 24px)/3)}}
@media(max-width:600px){.grid{gap:12px}.grid>.pc{flex-basis:calc((100% - 12px)/2)}.pb h3{font-size:13px}}
.logo small{display:block;font-size:14px;font-weight:700;color:#ffb703;letter-spacing:.3px;direction:ltr;text-align:left;margin-top:1px}
.chips{display:none}.tb{display:none}
.sh{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end}.sh.open{display:flex}.shp{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.shl{display:grid;gap:6px}.shl a{padding:13px 12px;border-radius:12px;background:var(--bg);font-weight:600}
@media(max-width:760px){body{padding-bottom:128px}nav,.cartb{display:none}.hd{justify-content:center;padding:10px 16px 6px}.logo{font-size:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:var(--navy2)}.chips a{flex:0 0 auto;background:#ffffff1a;color:#fff;border-radius:99px;padding:3px 14px;font-size:13px}
.hero{padding:26px 0 44px}.hero h1{font-size:26px}.fit select{padding:12px}.fit .btn{grid-column:1/-1;padding:12px}.toast{bottom:140px}
.tb{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px #0b1f3a18}
.tb a,.tb button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);background:none;border:0;position:relative;line-height:1.5;padding:0}.tb span{font-size:20px}.tb .on{color:var(--or);font-weight:700}.tb b{position:absolute;top:-2px;inset-inline-end:22%;background:var(--or);color:#fff;border-radius:99px;min-width:17px;font-size:10px;text-align:center}
.sticky{bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:10px}}
</style>
</head>
<body>
<header><div class="hd">
<a href="#home" class="logo"><svg width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#143a66"/><rect x=".75" y=".75" width="46.5" height="46.5" rx="12.5" fill="none" stroke="#3b78c0" stroke-width="1.5"/><polygon points="24,7 38.5,15.5 38.5,32.5 24,41 9.5,32.5 9.5,15.5" fill="#0b1f3a"/><polygon points="24,12.5 33.8,18.2 33.8,29.8 24,35.5 14.2,29.8 14.2,18.2" fill="none" stroke="#ffb703" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="24" r="5.5" fill="#ffb703"/><circle cx="24" cy="24" r="2.2" fill="#0b1f3a"/></svg><span><span class="lg"><b>ابزار</b><i>یدکی</i></span><small>Abzaryadaki.com</small></span></a>
<form class="search" onsubmit="event.preventDefault();q=this.q.value;go('shop')"><input name="q" placeholder="نام قطعه، کد فنی یا خودرو..."><button>جستجو</button></form>
<button class="cartb" onclick="dr(1)">🛒 سبد<b id="cc">۰</b></button></div>
<nav><div class="w"><a href="#shop">همه محصولات</a><a href="#shop" onclick="cat='فیلتر'">فیلتر</a><a href="#shop" onclick="cat='ترمز'">ترمز</a><a href="#shop" onclick="cat='روغن'">روغن</a><a href="#shop" onclick="cat='ابزار'">ابزار</a><a href="#shop">پرفروش‌ها</a><a href="#shop">تخفیف‌ها</a></div></nav></header>
<main id="app"></main>
<footer><div class="w"><div><b>ابزار یدکی</b><br>قطعه اصل، قیمت شفاف، ارسال سریع.</div><div><b>خدمات</b><br>گارانتی اصالت · ۷ روز بازگشت · پشتیبانی واتساپ</div><div><b>پرداخت</b><br>درگاه امن بانکی · پرداخت در محل</div><div><b>تماس</b><br>ساعت کاری ۹ تا ۲۱<br>info@abzaryadaki.com</div></div></footer>
<aside class="dr" id="dr"><div style="display:flex;justify-content:space-between"><b>سبد خرید</b><button class="btn ghost" onclick="dr(0)">✕</button></div><div id="items"></div><div id="tot" style="margin:14px 0;font-weight:800"></div><button class="btn" style="width:100%" onclick="alert('این یک نمونه است؛ در نسخه نهایی به درگاه پرداخت متصل می‌شود.')">ادامه و پرداخت امن</button></aside>
<script>
const P=[
{id:1,n:'فیلتر روغن پراید و تیبا',c:'فیلتر',e:'🛢️',p:185000,o:220000,b:'سایپا یدک',s:1,r:'۴٫۸'},
{id:2,n:'لنت ترمز جلو پژو ۲۰۶',c:'ترمز',e:'🛑',p:690000,o:790000,b:'بوش',s:1,r:'۴٫۹'},
{id:3,n:'روغن موتور ۵W-30 چهار لیتری',c:'روغن',e:'🧴',p:1450000,o:0,b:'ایرانول',s:0,r:'۴٫۷'},
{id:4,n:'شمع موتور سوزنی (ست ۴ تایی)',c:'برق',e:'⚡',p:540000,o:620000,b:'NGK',s:1,r:'۴٫۸'},
{id:5,n:'ست آچار بکس ۴۶ عددی',c:'ابزار',e:'🔧',p:2350000,o:2900000,b:'رونیکس',s:1,r:'۴٫۶'},
{id:6,n:'تیغه برف‌پاک‌کن سیلیکونی',c:'بدنه',e:'🌧️',p:320000,o:0,b:'بوش',s:0,r:'۴٫۵'},
{id:7,n:'فیلتر هوا ۲۰۶ تیپ ۲',c:'فیلتر',e:'💨',p:260000,o:310000,b:'مان',s:1,r:'۴٫۷'},
{id:8,n:'جک روغنی ۲ تن',c:'ابزار',e:'🏗️',p:3100000,o:0,b:'توسن',s:0,r:'۴٫۴'}];
const F=n=>Number(n).toLocaleString('fa-IR'),$=s=>document.querySelector(s);
let cart=JSON.parse('[]'),cat='',q='',sort='';
const card=p=>`<div class="pc"><a href="#p-${p.id}" class="pi">${p.o?`<i>٪${F(Math.round(100-p.p/p.o*100))}</i>`:''}${p.e}</a><div class="pb"><small>${p.b} · ⭐ ${p.r}</small><h3><a href="#p-${p.id}">${p.n}</a></h3><small class="ok">${p.s?'موجود · ارسال امروز':'موجود در انبار'}</small><div class="pr"><div>${p.o?`<s>${F(p.o)}</s>`:''}<b>${F(p.p)}</b> <small>تومان</small></div><button class="btn" onclick="add(${p.id})">افزودن</button></div></div></div>`;
function home(){return `<section class="hero"><div class="w"><div><h1>قطعه درست، <em>فقط با یک جستجو</em><br>برای خودروی شما</h1><p>لوازم یدکی اصل و ابزار حرفه‌ای با گارانتی اصالت، قیمت شفاف و ارسال سریع.</p>
<div class="fit"><select><option>برند</option><option>پژو</option><option>سمند</option><option>پراید</option><option>دنا</option></select><select><option>مدل</option><option>۲۰۶</option><option>۴۰۵</option><option>تیبا</option></select><select><option>سال</option><option>۱۴۰۴</option><option>۱۴۰۳</option><option>۱۴۰۲</option></select><button class="btn" onclick="go('shop')">پیدا کن</button></div></div>
<div class="qt">${[['🛢️','فیلتر'],['🛑','ترمز'],['🧴','روغن'],['⚡','برق'],['🔧','ابزار'],['🌧️','بدنه']].map(([e,n])=>`<a href="#shop" onclick="cat='${n}'"><span>${e}</span>${n}</a>`).join('')}</div></div></section>
<div class="w"><div class="trust"><div><b>🛡️ ضمانت اصالت</b>کد رهگیری هر قطعه</div><div><b>🚚 ارسال سریع</b>تهران همان روز</div><div><b>↩️ ۷ روز بازگشت</b>بدون سوال</div><div><b>💳 پرداخت امن</b>درگاه شاپرک</div></div>
<h2>دسته‌بندی‌ها</h2><div class="cats">${[['🛢️','فیلتر'],['🛑','ترمز'],['🧴','روغن'],['⚡','برق'],['🔧','ابزار'],['🌧️','بدنه']].map(([e,n])=>`<a class="cat" href="#shop" onclick="cat='${n}'"><span>${e}</span>${n}</a>`).join('')}</div>
<h2>پرفروش‌ترین‌ها <a href="#shop">مشاهده همه ‹</a></h2><div class="grid">${P.slice(0,5).map(card).join('')}</div>
<h2>تخفیف‌های ویژه</h2><div class="grid">${P.filter(p=>p.o).slice(0,5).map(card).join('')}</div></div>`}
function shop(){let l=P.filter(p=>(!cat||p.c==cat)&&(!q||p.n.includes(q)));if(sort=='a')l.sort((a,b)=>a.p-b.p);if(sort=='d')l.sort((a,b)=>b.p-a.p);
