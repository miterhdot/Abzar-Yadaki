const V={
home:()=>`<div class="top"><div class="row">${logo}<div class="rg"><a class="wa" href="https://wa.me/989120000000" target="_blank" rel="noopener"><i><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A9 9 0 1 1 8 19.6z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/></svg></i><span>۰۹۱۲ ۰۰۰ ۰۰۰۰</span></a>${cartBtn()}</div></div><form class="srch" onsubmit="event.preventDefault();q=this.q.value;go('cats')">🔍<input name="q" placeholder="جستجوی قطعه، کد فنی یا ابزار"></form></div>
<div class="car" onclick="carSheet()"><div class="ic">${ci('c',24)}</div><div><small>قطعات سازگار با</small><b>${car||'خودروی خود را انتخاب کنید'}</b></div><span class="ch">${car?'تغییر':'انتخاب ‹'}</span></div>
<button class="ai" onclick="aiSheet()"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l2 6.2L20.5 10 14 12l-2 6.2L10 12 3.5 10 10 8.2z"/><path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/></svg></div><div><b>خرید با هوش مصنوعی</b><small>بگو چه کاری روی خودرو داری؛ قطعه را پیدا می‌کنم</small></div></button>
<div class="hs" style="margin-top:18px">${C.map(([e,n])=>`<a class="cc" href="#cats" onclick="cat='${n}'"><span>${ci(e)}</span>${n}</a>`).join('')}</div>
<div class="hs" style="margin-top:6px"><div class="bn" style="background:linear-gradient(135deg,#143a66,#0b1f3a)"><b>روغن و فیلتر</b><small>سرویس دوره‌ای با ضمانت اصالت</small><span class="b">خرید کن</span></div><div class="bn" style="background:linear-gradient(135deg,#0f766e,#134e4a)"><b>ارسال همان‌روز</b><small>سفارش تا ساعت ۱۴ در تهران</small><span class="b">جزئیات</span></div><div class="bn" style="background:linear-gradient(135deg,#7c5a00,#3f2e00)"><b>ابزار حرفه‌ای</b><small>ست آچار، جک و تجهیزات</small><span class="b">مشاهده</span></div></div>
<div class="sec"><span class="row"><b>تخفیف ویژه</b><span class="tm" id="tm"></span></span><a href="#cats">همه ‹</a></div><div class="g">${P.filter(p=>p.o).slice(0,4).map(card).join('')}</div>
<div class="sec"><b>پرفروش‌ها</b><a href="#cats">همه ‹</a></div><div class="g">${P.slice(0,4).map(card).join('')}</div>
<div class="tr"><div><span>🛡️</span>ضمانت اصالت</div><div><span>🚚</span>ارسال سریع</div><div><span>↩️</span>۷ روز بازگشت</div></div>
<div class="sec"><b>پیشنهاد برای شما</b></div><div class="g">${P.slice(6,12).map(card).join('')}</div>`,
cats:()=>{const l=P.filter(p=>(!cat||p.c==cat)&&(!q||p.n.includes(q)));return `<div class="hd2"><b>${cat||'همه محصولات'}</b><span style="margin-inline-start:auto;color:var(--mute);font-size:13px">${F(l.length)} کالا</span>${cartBtn()}</div><div class="chips"><button class="${cat?'':'on'}" onclick="cat='';q='';rd()">همه</button>${C.map(([e,n])=>`<button class="${cat==n?'on':''}" onclick="cat='${n}';rd()">${n}</button>`).join('')}</div>${l.length?`<div class="g">${l.map(card).join('')}</div>`:'<div class="em"><span>🔍</span>محصولی پیدا نشد</div>'}`},
cart:()=>{const t=tot(),ks=Object.keys(cart);if(!ks.length)return `<div class="hd2"><b>سبد خرید</b></div><div class="em"><span>🛒</span>سبد شما خالی است<br><br><button class="bt" onclick="go('cats')">دیدن محصولات</button></div>`;const f=t>=FREE?0:80000;return `<div class="hd2"><b>سبد خرید</b><span style="margin-inline-start:auto;color:var(--mute);font-size:13px">${F(cnt())} کالا</span></div><div style="padding:14px 16px 4px;font-size:13px">${t>=FREE?'<span class="ok">ارسال شما رایگان است 🎉</span>':F(FREE-t)+' تومان تا ارسال رایگان'}<div class="pg"><i style="width:${Math.min(100,t/FREE*100)}%"></i></div></div>${ks.map(i=>{const p=P.find(x=>x.id==i);return `<div class="ci"><div class="im">${ic(p,34)}</div><div><b>${p.n}</b>${F(p.p)} تومان</div><div class="qt"><button onclick="ch(${i},1)">+</button><span>${F(cart[i])}</span><button onclick="ch(${i},-1)">−</button></div></div>`}).join('')}<div class="sm"><div class="row"><span>جمع کالاها</span><span>${F(t)}</span></div><div class="row"><span>ارسال</span><span>${f?F(f):'رایگان'}</span></div><div class="row"><b>مبلغ نهایی</b><b>${F(t+f)} تومان</b></div></div><div style="padding:0 16px"><button class="bt n" onclick="done()">ثبت سفارش و پرداخت</button></div>`},
me:()=>`<div class="top" style="padding-bottom:30px"><div class="row">${logo}</div></div><div class="sec"><b>حساب کاربری</b></div><div class="mn"><a href="#cart"><span>📦 سفارش‌های من</span>‹</a><a href="#me" onclick="toast('${fav.size?F(fav.size)+' کالا در علاقه‌مندی‌ها':'علاقه‌مندی خالی است'}')"><span>⭐ علاقه‌مندی‌ها</span>‹</a><a href="#me" onclick="carSheet()"><span>خودروی من</span><span>${car||'‹'}</span></a><a href="#me" onclick="toast('پشتیبانی: ساعت ۹ تا ۲۱')"><span>💬 پشتیبانی</span>‹</a><a href="#me" onclick="toast('نمونه: درباره ابزار یدکی')"><span>ℹ️ درباره ما</span>‹</a></div>`
};
function prod(id){const p=P.find(x=>x.id==id);if(!p)return V.home();return `<div class="hd2"><button class="bk" onclick="history.back()">›</button><b style="font-size:15px">${p.c}</b><button class="bk st2" style="margin-inline-start:auto" onclick="tf(${p.id})">${fav.has(p.id)?'★':'☆'}</button></div><div class="gal">${ic(p,120)}${cartBtn('fl')}</div><div class="dots"><i></i><i></i><i></i></div><div class="pi"><small style="color:var(--mute)">${p.b} · ⭐ ${p.r}</small><h1>${p.n}</h1><span class="ok">● موجود در انبار</span></div><div class="bx"><div>🚚 ارسال همان‌روز در تهران</div><div>🛡️ ضمانت اصالت کالا</div><div>↩️ ۷ روز مهلت بازگشت</div>${car?`<div class="ok">✔ سازگار با ${car} (طبق انتخاب شما)</div>`:'<div style="color:var(--n2);font-weight:600" onclick="carSheet()">انتخاب خودرو برای بررسی سازگاری ‹</div>'}</div><div class="sec"><b>مشخصات</b></div><div class="bx"><div>برند: ${p.b}</div><div>دسته: ${p.c}</div><div>گارانتی: اصالت و سلامت فیزیکی</div></div><div class="sec"><b>کالاهای مرتبط</b></div><div class="g">${P.filter(x=>x.id!=id).slice(0,4).map(card).join('')}</div>`}
function rd(){const h=location.hash.slice(1)||'home',pr=h.startsWith('p-');$('#v').innerHTML=pr?prod(h.slice(2)):(V[h]||V.home)();const b=$('#bb');if(pr){const p=P.find(x=>x.id==h.slice(2));b.style.display='flex';b.innerHTML=`<div class="pr">${p.o?`<s>${F(p.o)}</s>`:''}<b>${F(p.p)}</b> <small>تومان</small></div><button class="bt" onclick="add(${p.id})">افزودن به سبد</button>`;$('#tab').style.display='none'}else{b.style.display='none';$('#tab').style.display='flex'}document.querySelectorAll('#tab a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+(h=='home'||pr?(pr?'':'home'):h)));$('#cb').textContent=cnt()?F(cnt()):'';$('#cb').style.display=cnt()?'':'none';if(!pr)scrollTo(0,0)}
function add(id){cart[id]=(cart[id]||0)+1;toast('به سبد اضافه شد ✓');document.querySelectorAll('.cn').forEach(e=>e.textContent=F(cnt()));$('#cb').textContent=F(cnt());$('#cb').style.display=''}
function ch(i,d){cart[i]+=d;if(cart[i]<1)delete cart[i];rd()}
function tf(i){fav.has(i)?fav.delete(i):fav.add(i);rd()}
function oc(){$('#ov').classList.remove('open')}
function carSheet(){$('#sh').innerHTML=`<h3>خودروی شما کدام است؟</h3><div class="cl">${CARS.map(c=>`<button class="${car==c?'on':''}" onclick="car='${c}';oc();rd();toast('ثبت شد: ${c}')">${c}</button>`).join('')}</div><button class="bt n" onclick="car='';oc();rd()">پاک کردن انتخاب</button>`;$('#ov').classList.add('open')}
function done(){const c='AY-'+Math.random().toString(36).slice(2,8).toUpperCase();cart={};$('#sh').innerHTML=`<div style="text-align:center"><div style="font-size:56px">✅</div><h3>سفارش شما ثبت شد</h3><p style="color:var(--mute)">کد پیگیری: <b style="color:var(--ink)">${c}</b></p><button class="bt n" onclick="oc();go('home')">بازگشت به خانه</button></div>`;$('#ov').classList.add('open')}
let hist=[];const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const SYS=()=>`تو دستیار خرید فروشگاه «ابزار یدکی» هستی. فقط فارسی و کوتاه (حداکثر سه جمله) جواب بده. فقط از کاتالوگ زیر پیشنهاد بده و شناسه‌ی هر پیشنهاد را به شکل [[شماره]] در انتهای پیام بنویس (حداکثر ۳ مورد). درباره‌ی سازگاری قطعه با خودرو قطعی حرف نزن؛ بگو قبل از خرید کد فنی را تطبیق دهد. اگر کالای مناسب نیست صادقانه بگو. خودروی مشتری: ${car||'نامشخص'}.\nکاتالوگ (شناسه|نام|دسته|قیمت به تومان):\n${P.map(p=>[p.id,p.n,p.c,p.p].join('|')).join('\n')}`;
function aiDraw(){const m=$('#ml');if(!m)return;m.innerHTML=hist.map(x=>x.role=='u'?`<div class="mb u">${esc(x.t)}</div>`:`<div class="mb a">${esc(x.t.replace(/\[\[\d+\]\]/g,'').trim())}${[...x.t.matchAll(/\[\[(\d+)\]\]/g)].map(r=>P.find(p=>p.id==r[1])).filter(Boolean).map(p=>`<div class="mc"><span>${p.n}<br><b>${F(p.p)} تومان</b></span><button onclick="add(${p.id})">افزودن</button></div>`).join('')}</div>`).join('');m.scrollTop=m.scrollHeight}
function aiSheet(){if(!hist.length)hist=[{role:'a',t:'سلام! بگو چه کاری روی خودرو داری (مثلاً «سرویس دوره‌ای پراید») تا بهترین قطعه‌ها را پیشنهاد بدهم.'}];$('#sh').innerHTML=`<h3>خرید با هوش مصنوعی</h3><div class="ml" id="ml"></div><form class="aif" onsubmit="aiSend(event)"><input name="t" placeholder="چه قطعه‌ای لازم داری؟" autocomplete="off"><button class="bt">ارسال</button></form>`;$('#ov').classList.add('open');aiDraw()}
async function aiSend(e){e.preventDefault();const i=e.target.t,t=i.value.trim();if(!t)return;i.value='';hist.push({role:'u',t});hist.push({role:'a',t:'در حال فکر کردن...'});aiDraw();let r;try{const s=window.claude&&await claude.use('sample');if(!s)throw 0;const x=await s([{role:'user',content:SYS()+'\n\nمکالمه تا اینجا:\n'+hist.slice(0,-1).map(m=>(m.role=='u'?'مشتری: ':'دستیار: ')+m.t).join('\n')+'\n\nپیام بعدی دستیار:'}],{cache:false});r=x.text}catch(err){r='دستیار هوشمند فعلاً در دسترس نیست؛ از دسته‌ها یا جستجو استفاده کن.'}hist[hist.length-1].t=r;aiDraw()}
addEventListener('hashchange',rd);
setInterval(()=>{const e=$('#tm');if(!e)return;const n=new Date,t=new Date(n);t.setHours(24,0,0,0);const s=Math.floor((t-n)/1e3);e.innerHTML=`<span>${pd(s/3600|0)}</span><span>${pd(s%3600/60|0)}</span><span>${pd(s%60)}</span>`},1000);
rd();
</script>
</body>
</html>
